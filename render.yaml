# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
# Secrets are generated by Render or entered in the dashboard; none are stored in git.
services:
  - type: web
    name: smart-city-portal
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render puts 3 proxies in front of the app (Cloudflare -> load balancer -> ingress).
      # 3 makes req.ip the real client IP, so per-IP rate limits work and cannot be spoofed.
      - key: TRUST_PROXY
        value: "3"
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_KEY
        generateValue: true
      - key: API_KEYS
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@smartcity.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEOCODER_PROVIDER
        value: nominatim
      - key: GEOCODER_COUNTRY_CODES
        value: in
      - key: SMS_PROVIDER
        value: mock
